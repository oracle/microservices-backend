server:
  port: ${PORT:8081}

spring:
  application:
    name: loan-application-service
  cloud:
    config:
      import-check:
        enabled: false
    discovery:
      enabled: ${EUREKA_CLIENT_ENABLED:false}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LOAN_DATASOURCE_URL:${SPRING_DATASOURCE_URL:}}
    username: ${LOAN_DATASOURCE_USERNAME:CB_LOAN_APPLICATION_APP}
    password: ${LOAN_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    type: oracle.ucp.jdbc.PoolDataSource
    oracleucp:
      connection-factory-class-name: oracle.jdbc.pool.OracleDataSource
      connection-pool-name: LoanApplicationConnectionPool
      initial-pool-size: 2
      min-pool-size: 1
      max-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: ${LOAN_SCHEMA:CLOUDBANK}
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZN_ISSUER_URI:http://127.0.0.1:8080}
          jwk-set-uri: ${AZN_JWK_SET_URI:http://127.0.0.1:8080/oauth2/jwks}

cloudbank:
  security:
    audience: ${AZN_AUDIENCE:cloudbank-api}
    internal-client-ids: ${LOAN_INTERNAL_CLIENT_IDS:cloudbank-service-client,cloudbank-document-ingest-client}
  workflow:
    mode: ${WORKFLOW_MODE:fake}
    base-url: ${MICROTX_WORKFLOW_URL:}
    name: ${MICROTX_WORKFLOW_NAME:cloudbank-loan-origination}
    token-uri: ${MICROTX_TOKEN_URI:}
    client-id: ${MICROTX_CLIENT_ID:microtx-workflow-client}
    client-secret: ${MICROTX_CLIENT_SECRET:}
    scope: ${MICROTX_SCOPE:microtx.workflow}
    task-token-uri: ${WORKFLOW_TASK_TOKEN_URI:${MICROTX_TOKEN_URI:}}
    task-client-id: ${WORKFLOW_TASK_CLIENT_ID:cloudbank-service-client}
    task-client-secret: ${WORKFLOW_TASK_CLIENT_SECRET:}
    task-scope: ${WORKFLOW_TASK_SCOPE:cloudbank.internal}
    dispatch-delay-ms: ${WORKFLOW_DISPATCH_DELAY_MS:1000}
    max-dispatch-attempts: ${WORKFLOW_MAX_DISPATCH_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    probes:
      enabled: true

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.cloudbank.loanapplication: INFO
    org.springframework.security: INFO
