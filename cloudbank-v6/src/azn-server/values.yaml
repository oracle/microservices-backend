# CloudBank Authorization Server - Helm Values
#
# Install with (from this directory):
#   helm install azn-server ../../helm/app-charts/obaas-sample-app -f values.yaml -n <namespace>
#
# Upgrade with:
#   helm upgrade azn-server ../../helm/app-charts/obaas-sample-app -f values.yaml -n <namespace>
#
# Uninstall with:
#   helm uninstall azn-server -n <namespace>

# -----------------------
# -- Required Configuration
fullnameOverride: "azn-server"

image:
  # Set by deploy/obaas/deploy-azn-server.sh for the target OCIR repository.
  tag: ""         # e.g., 0.0.1-SNAPSHOT

obaas:
  releaseName: "obaas"
  framework: "SPRING_BOOT"

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

database:
  authN:
    secretName: "cloudbank-ai-azn-db-authn"
  aq:
    enabled: false


# -----------------------
# -- Feature Toggles

eureka:
  enabled: true

otel:
  enabled: true

otmm:
  enabled: false

env:
  - name: EUREKA_CLIENT_ENABLED
    value: "true"
  - name: AZN_ISSUER_URI
    value: "http://azn-server.obaas.svc.cluster.local:8080"
  - name: AZN_DATASOURCE_URL
    value: "jdbc:oracle:thin:@$(DB_SERVICE)?TNS_ADMIN=/oracle/tnsadmin"
  - name: AZN_USER_REPO_USERNAME
    value: "USER_REPO_APP"
  - name: AZN_USER_REPO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-db-authn"
        key: "password"
  - name: AZN_LIQUIBASE_URL
    value: "jdbc:oracle:thin:@$(DB_SERVICE)?TNS_ADMIN=/oracle/tnsadmin"
  - name: AZN_LIQUIBASE_USERNAME
    valueFrom:
      secretKeyRef:
        name: "obaasdev-db-priv-authn"
        key: "username"
  - name: AZN_LIQUIBASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "obaasdev-db-priv-authn"
        key: "password"
  - name: AZN_USER_REPO_OWNER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "user-repo-owner-password"
  - name: AZN_BOOTSTRAP_USERS_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "admin-password"
  - name: AZN_BOOTSTRAP_USERS_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "user-password"
  - name: AZN_AUTHORIZATION_SERVER_DEFAULT_CLIENT_ENABLED
    value: "true"
  - name: AZN_AUTHORIZATION_SERVER_DEFAULT_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "default-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_SERVICE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "service-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_DOCUMENT_INGEST_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "document-ingest-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_DOCUMENT_REVIEW_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "document-review-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_AI_AGENT_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "ai-agent-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_BFF_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "bff-client-secret"
        optional: true
  - name: AZN_AUTHORIZATION_SERVER_BFF_CLIENT_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "bff-redirect-uri"
        optional: true
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-auth"
        key: "microtx-client-secret"
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-microtx-console"
        key: "client-id"
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-microtx-console"
        key: "client-secret"
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_SCOPES
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-microtx-console"
        key: "scopes"
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-microtx-console"
        key: "redirect-uri"
  - name: AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_POST_LOGOUT_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-microtx-console"
        key: "post-logout-redirect-uri"
  - name: AZN_AUTHORIZATION_SERVER_SIGNING_KEY_PRIVATE_KEY_PATH
    value: "/etc/azn-server/signing/private.pem"
  - name: AZN_AUTHORIZATION_SERVER_SIGNING_KEY_PUBLIC_KEY_PATH
    value: "/etc/azn-server/signing/public.pem"
  - name: AZN_AUTHORIZATION_SERVER_SIGNING_KEY_KEY_ID
    valueFrom:
      secretKeyRef:
        name: "cloudbank-ai-azn-signing-key"
        key: "key-id"
  - name: AZN_PERSISTENT_SIGNING_KEY_REQUIRED
    value: "true"

volumes:
  - name: azn-server-signing-key
    secret:
      secretName: "cloudbank-ai-azn-signing-key"
      defaultMode: 288

volumeMounts:
  - name: azn-server-signing-key
    mountPath: "/etc/azn-server/signing"
    readOnly: true

# Add deployment-specific secrets before installing:
#   AZN_USER_REPO_PASSWORD
#   OBAAS_ADMIN_PASSWORD
#   OBAAS_USER_PASSWORD
#   AZN_AUTHORIZATION_SERVER_DEFAULT_CLIENT_SECRET, if the local default client is enabled
#   AZN_AUTHORIZATION_SERVER_SERVICE_CLIENT_SECRET, for service-to-service tokens
#   AZN_AUTHORIZATION_SERVER_MICROTX_CLIENT_SECRET, for MicroTx Workflow API tokens
#   AZN_AUTHORIZATION_SERVER_MICROTX_CONSOLE_CLIENT_* values, for the optional MicroTx Console OIDC client
#   AZN_AUTHORIZATION_SERVER_TEST_CLIENT_SECRET, for smoke-test tokens
#   AZN_AUTHORIZATION_SERVER_ADMIN_CLIENT_SECRET, for admin-scope tokens
#   AZN_AUTHORIZATION_SERVER_SIGNING_KEY_* values for a mounted persistent signing-key secret
# The default client id is cloudbank-client unless AZN_AUTHORIZATION_SERVER_DEFAULT_CLIENT_ID overrides it.
# The CloudBank deployment script mounts <dbname>-azn-server-signing-key at /etc/azn-server/signing.

