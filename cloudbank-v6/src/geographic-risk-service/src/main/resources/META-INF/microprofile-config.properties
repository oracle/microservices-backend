server.port=8080
server.host=0.0.0.0

geographic-risk.boundary-distance-meters=${GEOGRAPHIC_RISK_BOUNDARY_DISTANCE_METERS:100}
geographic-risk.geocoding.log-details=${GEOGRAPHIC_RISK_LOG_GEOCODING_DETAILS:false}

# Internal APIs accept signed service tokens from CloudBank azn-server.
# workflowTaskAuthorization is an interim workflow mechanism; do not place
# tokens, client secrets, or signing material in this configuration.
mp.jwt.verify.issuer=${AZN_ISSUER_URI:http://127.0.0.1:8080}
mp.jwt.verify.publickey.location=${AZN_JWK_SET_URI:http://127.0.0.1:8080/oauth2/jwks}
mp.jwt.verify.audiences=${AZN_AUDIENCE:cloudbank-api}
geographic-risk.security.internal-client-ids=${GEOGRAPHIC_RISK_CALLER_CLIENT_IDS:cloudbank-service-client}

data.persistence-units.jakarta.0.connection.username=${javax.sql.DataSource.geographic-risk.user}
data.persistence-units.jakarta.0.connection.password=${javax.sql.DataSource.geographic-risk.password}
data.persistence-units.jakarta.0.connection.url=${javax.sql.DataSource.geographic-risk.URL}
data.persistence-units.jakarta.0.connection.jdbc-driver-class-name=oracle.jdbc.OracleDriver
data.persistence-units.jakarta.0.properties.eclipselink.target-database=Oracle
data.persistence-units.jakarta.0.properties.eclipselink.target-server=None
data.persistence-units.jakarta.0.properties.jakarta.persistence.schema-generation.database.action=none
