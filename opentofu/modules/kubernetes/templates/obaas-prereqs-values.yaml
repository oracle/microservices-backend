#-- Included in OKE as add-on; applies to cert-manager
oracle-database-operator:
  enabled: false

%{ if byo_ocir_url != "" ~}
external-secrets:
  image:
    repository: ${byo_ocir_url}/external-secrets/external-secrets
  webhook:
    image:
      repository: ${byo_ocir_url}/external-secrets/external-secrets
  certController:
    image:
      repository: ${byo_ocir_url}/external-secrets/external-secrets

metrics-server:
  image:
    repository: ${byo_ocir_url}/metrics-server/metrics-server

kube-state-metrics:
  image:
    registry: ${byo_ocir_url}

strimzi-kafka-operator:
  defaultImageRegistry: ${byo_ocir_url}
%{ endif ~}