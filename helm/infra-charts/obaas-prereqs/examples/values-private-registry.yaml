# =============================================================================
# Example: Private Registry Configuration for OBaaS Prerequisites Chart
# =============================================================================
#
# This example shows how to configure all images to pull from a private
# container registry (e.g., for air-gapped installations).
#
# IMPORTANT: This file is for the 'obaas-prereqs' chart only (cluster singletons).
# For the 'obaas' chart, see the corresponding example in ../obaas/examples/
#
# Prerequisites:
#   1. Create the image pull secret before installing:
#      kubectl create secret docker-registry myregistry-secret \
#        --docker-server=myregistry.example.com \
#        --docker-username=<username> \
#        --docker-password=<password> \
#        --docker-email=<email> \
#        -n <namespace>
#
#   2. Mirror the required images to your private registry
#   3. Configure images and pull secrets in the separate cert-manager installation
#
# Usage:
#   helm install obaas-prereqs ./obaas-prereqs -n <namespace> -f examples/values-private-registry.yaml
#
# =============================================================================

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -----------------------
# -- Global Configuration
# -----------------------
global:
  # All prerequisite components install into the release namespace (specified with -n flag)
  # There is no global namespace override - components use the namespace you provide during install

  # Image pull secret for private registry authentication
  # This is automatically propagated to all subcharts via YAML anchors
  imagePullSecrets: &imagePullSecrets
    - name: myregistry-secret

# ------------------------------------
# -- OBaaS Prerequisites Configuration
# ------------------------------------

# These are cluster-scoped singleton components that should only be installed once per cluster
#
# Image Override Pattern:
# All image configurations are commented out by default to use upstream defaults.
# To use a private registry or air-gapped installation, uncomment and set the image values.
# Example: Change "registry.k8s.io" to "myregistry.example.com" for all components.

# -------------------------
# -- SubChart Configuration
# -------------------------

# =============================================================================
# Oracle Database Operator
# =============================================================================
# Default operator registry: container-registry.oracle.com
# Default CRD configuration Job registry: registry.k8s.io

oracle-database-operator:
  enabled: true
  # Empty namespace will cause the use of .Release.Namespace
  namespaceOverride: ""
  replicas: 1
  # Image pull secrets for the operator and CRD configuration Job
  imagePullSecrets: *imagePullSecrets
  image:
    registry: myregistry.example.com
    repository: database/operator
    # Specify a version tag for reproducible deployments
    tag: "2.2.0"
    pullPolicy: IfNotPresent
  crdConfiguration:
    image: myregistry.example.com/kubectl:v1.36.3
  # Deployment scope configuration
  scope:
    mode: cluster
  # RBAC configuration
  rbac:
    nodeAccess: false
  # Enable leader election for controller manager
  leaderElection: true
  # Pod Disruption Budget (only applies when replicas > 1)
  pdb:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1  # Requires minAvailable: null

# =============================================================================
# external-secrets
# =============================================================================
# Default registry: ghcr.io
# Uses full repository path

external-secrets:
  enabled: true
  installCRDs: true
  # Uses global.imagePullSecrets
  imagePullSecrets: *imagePullSecrets
  global:
    imagePullSecrets: *imagePullSecrets
  # Uncomment to override the default image repository
  image:
    repository: "myregistry.example.com/external-secrets/external-secrets"
  webhook:
    image:
      repository: myregistry.example.com/external-secrets/external-secrets
      pullPolicy: IfNotPresent
    imagePullSecrets: *imagePullSecrets
  certController:
    image:
      repository: myregistry.example.com/external-secrets/external-secrets
      pullPolicy: IfNotPresent
    imagePullSecrets: *imagePullSecrets

# =============================================================================
# metrics-server
# =============================================================================
# Default registry: registry.k8s.io
# Uses full repository path

metrics-server:
  enabled: true
  # Uses global.imagePullSecrets
  # global:
  imagePullSecrets: *imagePullSecrets
  # Uncomment to override the default image repository
  image:
    repository: "myregistry.example.com/metrics-server/metrics-server"

# =============================================================================
# kube-state-metrics
# =============================================================================
# Default registry: registry.k8s.io

kube-state-metrics:
  enabled: true
  imagePullSecrets: *imagePullSecrets
  # global:
  #   # Uses global.imagePullSecrets
  #   imagePullSecrets: *imagePullSecrets
  # Uncomment to override the default image
  image:
    registry: "myregistry.example.com"  # Default: registry.k8s.io
    repository: "kube-state-metrics/kube-state-metrics"
  # Control which namespaces it monitors
  # releaseNamespace: false  # Set to true to only watch release namespace
  # namespaces: ""  # Comma-separated list or yaml list of namespaces to watch
  # namespacesDenylist: ""  # Namespaces to exclude from watching

# =============================================================================
# strimzi-kafka-operator
# =============================================================================
# Default registry: quay.io
# Uses defaultImageRegistry for operator and Kafka images

strimzi-kafka-operator:
  enabled: true
  # List of namespaces the operator should watch (empty = watch all namespaces)
  watchNamespaces: []
  # Set to true to watch all namespaces (recommended for multi-tenant OBaaS installations)
  watchAnyNamespace: true
  # Uncomment to override the default image registry and repository
  defaultImageRegistry: "myregistry.example.com"  # Default: quay.io
  defaultImageRepository: "strimzi"  # Default: strimzi
  defaultImageTag: 1.2.0
  image:
    # Uses global.imagePullSecrets
    imagePullSecrets: *imagePullSecrets
    registry: myregistry.example.com
    repository: strimzi
    name: operator
    tag: 1.2.0

# =============================================================================
# coherence-operator
# =============================================================================
# Default registry: container-registry.oracle.com/middleware

coherence-operator:
  enabled: true
  # Uses global.imagePullSecrets
  imagePullSecrets: *imagePullSecrets
  # Operator image configuration
  image:
    registry: "myregistry.example.com/middleware"
    name: "coherence-operator"
    tag: "3.5.17"
  # Default Coherence image for applications
  defaultCoherenceImage:
    registry: "myregistry.example.com/middleware"
    name: "coherence-ce"
    tag: "26.04"
  # One operator replica is sufficient for evaluation/development clusters.
  # Increase to 3 for highly available operator reconciliation.
  replicas: 1
  # Namespaces to watch (empty string = all namespaces)
  # Override to limit operator scope: "namespace1,namespace2"
  watchNamespaces: ""
  # Override default resources if needed
  resources: {}

opentelemetry-operator:
  enabled: true
  # Uses global.imagePullSecrets
  imagePullSecrets: *imagePullSecrets
  manager:
    collectorImage:
      repository: "myregistry.example.com/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
      tag: "0.158.0"
    image:
      repository: "myregistry.example.com/open-telemetry/opentelemetry-operator"
      tag: "0.158.0"
