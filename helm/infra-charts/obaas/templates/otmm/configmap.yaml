{{- if .Values.otmm.coordinator.enabled }}
{{- include "obaas.otmm.validateStorage" . }}
{{- $storage := .Values.otmm.coordinator.storage }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otmm-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-otmm-tcs
    app.kubernetes.io/component: transaction-coordinator
    app.kubernetes.io/part-of: {{ .Release.Name }}
    {{- include "obaas.labels" . | nindent 4 }}
data:
  APPLICATION_NAMESPACE: ""
  AUTHORIZATION_ENABLED: "false"
  AUTHORIZATION_TOKEN_PROPAGATION_ENABLED: "false"
  BATCH_INTERVAL: "60"
  CACHE_ENABLED: "true"
  CACHE_MAX_CAPACITY: "1"
  COMPLETED_TX_TTL: "60"
  COUNTERS_UPDATE_INTERVAL_IN_SECS: "60"
  ENCRYPTION_SECRET_KEY_VERSION: "1"
  ENCRYPTION_SECRET_KEYS: '{"secretKeys":[{"secretKeyName":"encryption-secret-key","version":"1"}]}'
  EXTERNAL_ADDR: {{ printf "http://%s-otmm-tcs.%s.svc.cluster.local:9000" .Release.Name .Release.Namespace }}
  HTTP_CLIENT_TIMEOUT_IN_SECS: "60"
  HTTP_TRACE_ENABLED: "true"
  ID: TCS01
  IDENTITY_PROVIDER_CLIENT_ID: ""
  IDENTITY_PROVIDER_NAME: ""
  IDENTITY_PROVIDER_URL: ""
  INTERNAL_ADDR: {{ printf "http://%s-otmm-tcs:9000" .Release.Name }}
  ISTIO_INGRESS_GATEWAY: ingressgateway
  ISTIO_SYSTEM_NAMESPACE: ""
  LISTEN_ADDR: "0.0.0.0:9000"
  LOGGING_LEVEL: info
  LRA_COORDINATOR_ENABLED: "true"
  MAX_RETRY_COUNT: "10"
  MAX_RETRY_INTERVAL: "10000"
  MIN_RETRY_INTERVAL: "1000"
  NARAYANA_LRA_COMPATIBILITY_MODE: "false"
  NOTIFICATION_SPIKE_TIME_IN_SEC: "5"
  PORT: "9000"
  REQUEST_WITH_NO_JWT: ALLOW
  SERVE_TLS_ENABLED: "false"
  STORAGE_TYPE: {{ $storage.type | quote }}
  STORAGE_ETCD_ENDPOINTS: {{ ternary $storage.etcd.endpoints "" (eq $storage.type "etcd") | quote }}
  STORAGE_ETCD_SKIP_HOSTNAME_VERIFICATION: {{ ternary $storage.etcd.skipHostNameVerification false (eq $storage.type "etcd") | quote }}
  {{- if eq $storage.type "db" }}
  {{- if $storage.db.connectionString }}
  STORAGE_DB_CONNECTION_STRING: {{ $storage.db.connectionString | quote }}
  {{- end }}
  STORAGE_DB_CONNECTION_PARAMS: {{ $storage.db.connectionParams | quote }}
  {{- else if eq $storage.type "etcd" }}
  {{- if $storage.etcd.credentialSecretName }}
  STORAGE_ETCD_CREDENTIAL_SECRET_FILE_NAME: credentials.json
  STORAGE_ETCD_CA_CERT_FILE_NAME: ca.pem
  {{- end }}
  {{- end }}
  TCC_COORDINATOR_ENABLED: "true"
  TMM_APPNAME: {{ .Release.Name }}-otmm-tcs
  TMM_IMAGE: "{{ .Values.otmm.coordinator.image.repository }}:{{ .Values.otmm.coordinator.image.tag }}"
  TMM_IMAGE_PULLPOLICY: {{ .Values.otmm.coordinator.image.pullPolicy | default "IfNotPresent" }}
  TMM_IMAGE_PULLSECRET: {{ .Values.global.imagePullSecretName }}
  TMM_REPLICA_COUNT: "{{ .Values.otmm.coordinator.replicas }}"
  TRANSACTION_TOKEN_ENABLED: "false"
  XA_COORDINATOR_ENABLED: "true"
  XA_COORDINATOR_TX_MAX_TIMEOUT: "600000"
{{- end }}
