{{- include "obaas.otmm.validateStorage" . }}
{{- $persistence := .Values.otmm.workflowServer.config.storage.fileSystem.persistence }}
{{- if and .Values.otmm.workflowServer.enabled $persistence.enabled (not $persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "obaas.otmm.workflowClaim" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "obaas.labels" $ | nindent 4 }}
  {{- if $persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml $persistence.accessModes | nindent 4 }}
  {{- if $persistence.storageClass }}
  storageClassName: {{ $persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $persistence.size | quote }}
{{- end }}
