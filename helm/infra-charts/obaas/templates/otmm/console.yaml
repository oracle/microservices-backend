{{- if eq (include "otmm.console.enabled" .) "true" }}
{{- include "obaas.otmm.validateSecurity" . }}
{{- $coordinatorRoles := include "obaas.otmm.coordinatorRoles" . | fromYaml }}
{{- $security := .Values.otmm.commonConfiguration.security }}
{{- $idp := $security.identityProvider }}
{{- $externalURL := .Values.otmm.commonConfiguration.externalURL }}
{{- $consoleOrigin := printf "%s://%s" ($externalURL.protocol | default "http") ($externalURL.host | default (printf "%s-otmm-console" .Release.Name)) }}
{{- if $externalURL.port }}
{{- $consoleOrigin = printf "%s://%s:%v" $externalURL.protocol $externalURL.host $externalURL.port }}
{{- end }}
{{- $defaultScopes := ternary "openid groups" "openid" (eq $idp.serverType "idcs") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otmm-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obaas.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
    app.kubernetes.io/component: transaction-coordinator
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  ports:
    - name: http-stock
      port: 5001
      targetPort: http-console
      protocol: TCP
    - name: http-console
      port: 5002
      targetPort: http-console
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-otmm-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obaas.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
    app.kubernetes.io/component: transaction-coordinator
    app.kubernetes.io/part-of: {{ .Release.Name }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-otmm-console
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-otmm-console
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otmm-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "obaas.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
    app.kubernetes.io/component: transaction-coordinator
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  replicas: {{ .Values.otmm.console.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
  template:
    metadata:
      labels:
        {{- include "obaas.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Release.Name }}-otmm-console
        app.kubernetes.io/component: transaction-coordinator
        app.kubernetes.io/part-of: {{ .Release.Name }}
    spec:
      {{- include "obaas.imagePullSecrets" (dict "local" .Values.otmm.console.imagePullSecrets "global" .Values.global.imagePullSecrets "secretName" .Values.global.imagePullSecretName) | nindent 6 }}
      serviceAccountName: {{ .Release.Name }}-otmm-console
      containers:
        - name: console
          image: {{ .Values.otmm.console.image.repository }}:{{ .Values.otmm.console.image.tag }}
          imagePullPolicy: {{ .Values.otmm.console.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http-console
              containerPort: 8080
              protocol: TCP
          {{- $probes := .Values.otmm.console.probes | default dict }}
          {{- range $name := list "startup" "readiness" "liveness" }}
          {{- with index $probes $name }}
          {{ $name }}Probe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- with .Values.otmm.console.resources }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          {{- end }}
          env:
            - name: CONSOLE_APP_NAME
              value: console
            {{- if .Values.otmm.coordinator.enabled }}
            - name: TMM_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: TMM_APP_NAME
              value: otmm-tcs
            - name: TMM_TCS_URL
              value: "http://{{ .Release.Name }}-otmm-tcs:9000"
            {{- end }}
            {{- if $security.enabled }}
            - name: TMM_ADMIN_USER_ROLE_NAMES
              value: {{ $coordinatorRoles.adminUserRoles | quote }}
            - name: TMM_ROLES_PATH
              value: {{ $coordinatorRoles.adminUserRolesPath | quote }}
            - name: SECURITY_PROPERTIES_OIDC_IDENTITY_URI
              value: {{ $idp.identityProviderUrl | quote }}
            - name: SECURITY_PROPERTIES_COOKIE_ENCRYPTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otmm.console.cookieEncryptionPasswordSecretName }}
                  key: secret
            - name: SECURITY_PROPERTIES_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $security.clientSecretName }}
                  key: clientId
            - name: SECURITY_PROPERTIES_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $security.clientSecretName }}
                  key: clientPassword
            - name: SECURITY_PROPERTIES_OIDC_ISSUER
              value: {{ $idp.issuer | quote }}
            - name: SECURITY_PROPERTIES_OIDC_AUDIENCE
              value: {{ $idp.audience | quote }}
            - name: SECURITY_PROPERTIES_OIDC_BASE_SCOPES
              value: {{ $idp.scopes | default $defaultScopes | quote }}
            - name: SECURITY_PROPERTIES_FRONTEND_URI
              value: {{ printf "%s/console" $consoleOrigin | quote }}
            {{- end }}
            - name: SECURITY_ENABLED
              value: {{ $security.enabled | quote }}
            {{- if .Values.otmm.workflowServer.enabled }}
            # WorkflowServer URL configuration
            - name: WF_SERVER
              value: "http://{{ .Release.Name }}-otmm-workflow-server:9010"
            - name: CONDUCTOR_BACKEND_ENDPOINT
              value: "http://{{ .Release.Name }}-otmm-workflow-server:9010"
            - name: CONDUCTOR_FRONTEND_ENDPOINT
              value: {{ $consoleOrigin | quote }}
            {{- end }}
            - name: SECURITY_PROPERTIES_COOKIE_ENCRYPTION_ENABLED
              value: {{ .Values.otmm.console.cookieEncryption.enabled | quote }}
            - name: FAST_REFRESH
              value: "false"
{{- end }}
