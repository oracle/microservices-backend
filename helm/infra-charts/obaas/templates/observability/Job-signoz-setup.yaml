{{- if .Values.signoz.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-signoz-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: observability
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: signoz-setup
    spec:
      {{- if .Values.signoz.podAffinity }}
      affinity:
        {{- toYaml .Values.signoz.podAffinity | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                - signoz
            topologyKey: "kubernetes.io/hostname"
      {{- end }}
      {{- include "obaas.imagePullSecrets" (dict "local" .Values.signoz.global.imagePullSecrets "global" .Values.global.imagePullSecrets "secretName" .Values.global.imagePullSecretName) | nindent 6 }}
      containers:
      - args:
        - |
          set -e
          SIGNOZ_URL="http://{{ .Release.Name }}-signoz:8080"
          email=$(cat /signoz-authn/email)
          password=$(cat /signoz-authn/password)
          
          # Prioritize discovered Org ID, fallback to secret
          if [ -f /shared/orgID ]; then
            org_id=$(cat /shared/orgID)
            echo "Using discovered Org ID: ${org_id}"
          elif [ -f /signoz-authn/orgID ]; then
            org_id=$(cat /signoz-authn/orgID)
            echo "Using Org ID from secret: ${org_id}"
          else
            echo "ERROR: No Org ID found in shared volume or secret. Dynamic discovery failed."
            exit 1
          fi

          # Login and extract JWT token using v2 API
          echo "Logging in..."
          login_response=$(curl -sf -H 'Content-Type: application/json' \
            -d "{\"email\": \"${email}\", \"password\": \"${password}\", \"orgID\": \"${org_id}\"}" \
            "${SIGNOZ_URL}/api/v2/sessions/email_password")
          
          TOKEN=$(echo "$login_response" | sed 's/.*"accessToken":"\([^"]*\)".*/\1/')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to extract Access Token from v2 login response"
            echo "Response: $login_response"
            exit 1
          fi
          echo "Login successful"

          # Use JWT token for all subsequent requests
          AUTH_HEADER="Authorization: Bearer ${TOKEN}"

          # Extract only the top-level spec.display.name from a V2/Perses
          # dashboard file. Panel and variable display objects follow it.
          get_title() {
            awk '
              /"spec"[[:space:]]*:[[:space:]]*[{]/ {
                in_dashboard_spec = 1
                next
              }
              in_dashboard_spec && /"display"[[:space:]]*:[[:space:]]*[{]/ {
                in_dashboard_display = 1
                next
              }
              in_dashboard_display && /^[[:space:]]*"name"[[:space:]]*:/ {
                sub(/^[[:space:]]*"name"[[:space:]]*:[[:space:]]*"/, "")
                sub(/"[[:space:]]*,?[[:space:]]*$/, "")
                print
                exit
              }
            ' "$1"
          }

          # Fetch every V2 list page. The V2 response is wrapped in
          # {status, data}; dashboard summaries are in data.dashboards and the
          # total applies across pages. Keep the JSON pages intact because the
          # curl utility image intentionally has no JSON parser.
          dashboards_file=$(mktemp)
          offset=0
          page_size=200
          total=1
          echo "Fetching existing dashboards..."
          while [ "${offset}" -lt "${total}" ]; do
            page=$(curl -fsS -H "${AUTH_HEADER}" \
              "${SIGNOZ_URL}/api/v2/dashboards?limit=${page_size}&offset=${offset}")
            page_total=$(printf '%s' "${page}" | sed -n 's/.*"total":\([0-9][0-9]*\).*/\1/p')
            case "${page_total}" in
              ''|*[!0-9]*)
                echo "ERROR: SigNoz returned an invalid V2 dashboard list response"
                exit 1
                ;;
            esac
            printf '%s\n' "${page}" >> "${dashboards_file}"
            total="${page_total}"
            offset=$((offset + page_size))
          done

          # The V2 list endpoint also returns unmigratable V1 dashboards as
          # legacy=true records. Their summaries retain spec.display.name, so
          # reconcile them through the V2 delete endpoint rather than calling
          # the retired V1 API. Build the allowlist from the bundled files: a
          # dashboard owned by a user cannot be selected unless it deliberately
          # has the same name as an OBaaS system dashboard.
          system_dashboard_titles=$(mktemp)
          for dir in /signoz-dashboards-1 /signoz-dashboards-2; do
            [ -d "$dir" ] || continue
            for f in $(find -L "$dir" -maxdepth 1 -type f 2>/dev/null); do
              title=$(get_title "$f")
              [ -n "$title" ] && printf '%s\n' "$title"
            done
          done > "${system_dashboard_titles}"

          find_system_dashboard_uuids() {
            while IFS= read -r page; do
              printf '%s' "${page}" | sed 's/},{"id":/}\n{"id":/g' | \
                awk -v titles_file="${system_dashboard_titles}" '
                  BEGIN {
                    while ((getline title < titles_file) > 0) {
                      system_titles[title] = 1
                    }
                    close(titles_file)
                  }
                  {
                    id = ""
                    title = ""
                    if (match($0, /"id":"[^"]+"/)) {
                      id = substr($0, RSTART + 6, RLENGTH - 7)
                    }
                    if (match($0, /"display":[{]"name":"[^"]*"/)) {
                      title = substr($0, RSTART + 19, RLENGTH - 20)
                    }
                    if (id != "" && title in system_titles) {
                      print id
                    }
                  }
                '
            done < "${dashboards_file}"
          }

          # Delete every version of every bundled system dashboard first. This
          # includes rows marked legacy by SigNoz after its V1-to-V2 migration,
          # but leaves dashboards outside the bundled-title allowlist alone.
          find_system_dashboard_uuids | while IFS= read -r uuid; do
            [ -n "${uuid}" ] || continue
            echo "Deleting existing system dashboard: ${uuid}"
            curl -fsS -H "${AUTH_HEADER}" -X DELETE \
              "${SIGNOZ_URL}/api/v2/dashboards/${uuid}"
          done

          # Process dashboards from both directories
          for dir in /signoz-dashboards-1 /signoz-dashboards-2; do
            [ -d "$dir" ] || continue
            for f in $(find -L "$dir" -maxdepth 1 -type f 2>/dev/null); do
              title=$(get_title "$f")
              [ -z "$title" ] && continue
              echo "Reconciling dashboard: $title"

              # The bundled files are V2/Perses payloads (schemaVersion: v6).
              echo "  Creating dashboard..."
              curl -fsS -H "${AUTH_HEADER}" -H 'Content-Type: application/json' \
                -d @"${f}" "${SIGNOZ_URL}/api/v2/dashboards"
              echo "  Done"
            done
          done

          echo "SigNoz setup complete"
        command:
        - /bin/sh
        - -c
        image: {{ .Values.signoz.utilities.curlJq.image.registry }}/{{ .Values.signoz.utilities.curlJq.image.repository }}:{{ .Values.signoz.utilities.curlJq.image.tag }}
        name: signoz-setup
        volumeMounts:
        - mountPath: /shared
          name: shared-data
        - mountPath: /signoz-dashboards-1
          name: signoz-dashboards-1
          readOnly: true
        - mountPath: /signoz-authn
          name: signoz-authn
          readOnly: true
        - mountPath: /signoz-dashboards-2
          name: signoz-dashboards-2
          readOnly: true
      initContainers:
      - name: wait-for-query-service
        image: {{ .Values.signoz.utilities.curlJq.image.registry }}/{{ .Values.signoz.utilities.curlJq.image.repository }}:{{ .Values.signoz.utilities.curlJq.image.tag }}
        command:
        - sh
        - -c
        - |
          until wget --spider -q {{ .Release.Name }}-signoz:8080/api/v1/health?live=1; do 
            echo "Waiting for query-service..."; sleep 5; 
          done
          echo "query-service ready."
      - name: signoz-id-discovery
        image: {{ .Values.signoz.clickhouse.image.registry }}/{{ .Values.signoz.clickhouse.image.repository }}:{{ .Values.signoz.clickhouse.image.tag | default .Chart.AppVersion }}
        command:
        - sh
        - -c
        - |
          echo "Extracting Org ID from database using clickhouse-local..."
          
          # Extract Org ID using clickhouse-local (SQLite engine)
          ORG_ID=$(clickhouse-local -q "SELECT id FROM sqlite('/signoz-db/signoz.db', 'organizations') LIMIT 1")
          
          if [ -n "$ORG_ID" ]; then
            echo "$ORG_ID" > /shared/orgID
            echo "Found Org ID: $ORG_ID"
          else
            echo "ERROR: Could not find Org ID in DB file"
            exit 1
          fi
        volumeMounts:
        - mountPath: /shared
          name: shared-data
        - mountPath: /signoz-db
          name: signoz-db
          readOnly: true
      restartPolicy: OnFailure
      volumes:
      - name: shared-data
        emptyDir: {}
      - name: signoz-db
        persistentVolumeClaim:
          claimName: signoz-db-{{ .Release.Name }}-signoz-0
          readOnly: true
      - configMap:
          defaultMode: 420
          name: {{ .Release.Name }}-signoz-dashboards
        name: signoz-dashboards-1
      - name: signoz-authn
        secret:
          secretName: {{ include "obaas.signoz.secretName" . }}
      - configMap:
          defaultMode: 420
          name: {{ .Release.Name }}-signoz-dashboards-2
        name: signoz-dashboards-2
{{- end }}
