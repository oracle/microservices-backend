{{- if and .Values.signoz.enabled .Values.signoz.setup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-signoz-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: observability
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  backoffLimit: 6
  completions: 1
  parallelism: 1
  suspend: false
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: signoz-setup
    spec:
      {{- if .Values.signoz.podAffinity }}
      affinity:
        {{- toYaml .Values.signoz.podAffinity | nindent 8 }}
      {{- end }}
      {{- include "obaas.imagePullSecrets" (dict "local" .Values.signoz.global.imagePullSecrets "global" .Values.global.imagePullSecrets "secretName" .Values.global.imagePullSecretName) | nindent 6 }}
      containers:
      - command: ["python3", "-u", "/signoz-setup/setup.py"]
        env:
        - name: SIGNOZ_URL
          value: "http://{{ .Release.Name }}-signoz:8080"
        image: {{ .Values.signoz.setup.image.registry }}/{{ .Values.signoz.setup.image.repository }}:{{ .Values.signoz.setup.image.tag }}
        name: signoz-setup
        volumeMounts:
        - mountPath: /signoz-setup
          name: signoz-setup-script
          readOnly: true
        - mountPath: /signoz-dashboards-1
          name: signoz-dashboards-1
          readOnly: true
        - mountPath: /signoz-authn
          name: signoz-authn
          readOnly: true
        - mountPath: /signoz-dashboards-2
          name: signoz-dashboards-2
          readOnly: true
      restartPolicy: OnFailure
      volumes:
      - name: signoz-setup-script
        configMap:
          name: {{ .Release.Name }}-signoz-setup
      - configMap:
          defaultMode: 420
          name: {{ .Release.Name }}-signoz-dashboards
        name: signoz-dashboards-1
      - name: signoz-authn
        secret:
          secretName: {{ include "obaas.signoz.secretName" . }}
      - configMap:
          defaultMode: 420
          name: {{ .Release.Name }}-signoz-dashboards-2
        name: signoz-dashboards-2
{{- end }}
