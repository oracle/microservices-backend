{{- if and .Values.signoz.enabled .Values.signoz.setup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-signoz-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "19"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  setup.py: |
{{ .Files.Get "files/signoz/setup.py" | indent 4 }}
{{- end }}
