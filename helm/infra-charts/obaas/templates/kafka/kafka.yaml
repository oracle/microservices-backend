{{- if $.Values.kafka.enabled }}
{{- $replicas := int .Values.kafka.replicas }}
{{- $replicationFactor := min 3 $replicas }}
{{- $minInsyncReplicas := min 2 $replicas }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Release.Name }}-kafka-cluster
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storageSize }}
        {{- with .Values.kafka.storageClass }}
        class: {{ . | quote }}
        {{- end }}
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Release.Name }}-kafka-cluster
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    metadataVersion: {{ .Values.kafka.metadataVersion }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: {{ $replicationFactor }}
      transaction.state.log.replication.factor: {{ $replicationFactor }}
      transaction.state.log.min.isr: {{ $minInsyncReplicas }}
      default.replication.factor: {{ $replicationFactor }}
      min.insync.replicas: {{ $minInsyncReplicas }}
{{- if .Values.kafka.metricsEnabled }}
    metricsConfig:
      type: strimziMetricsReporter
    template:
      pod:
        metadata:
          annotations:
            signoz.io/scrape: "true"
            signoz.io/port: "9404"
{{- end }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
