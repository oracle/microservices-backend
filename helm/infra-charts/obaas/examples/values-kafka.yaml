# Example: Kafka Enabled Configuration
# This configuration enables the Strimzi-managed Kafka cluster created by the
# obaas chart, plus full Kafka observability in SigNoz (broker/topic/consumer
# facts via the OTel kafkametrics receiver, and broker JMX throughput/latency/
# health metrics via Strimzi's strimziMetricsReporter). All components deploy
# to the Helm release namespace.
#
# Prerequisites:
#   Install obaas-prereqs chart once per cluster before installing this chart.
#   Keep strimzi-kafka-operator enabled in obaas-prereqs.
#   Ensure the Strimzi operator watches the namespace where this chart is installed.
#
# Usage:
#   helm upgrade --install obaas . \
#     -f examples/values-kafka.yaml \
#     -n obaas \
#     --create-namespace
#
# Kafka bootstrap services:
#   Release "obaas" creates obaas-kafka-cluster-kafka-bootstrap:9092.
#   The chart also creates a stable alias, kafka-bootstrap:9092.

# -----------------------
# -- Global Configuration
global:
  # No private registry credentials needed
  imagePullSecrets: []

# -----------------------
# -- OBaaS Components
# Default access uses Envoy Gateway. Legacy ingress-nginx is disabled unless explicitly enabled.

# Service Discovery
eureka:
  enabled: true

# API Gateway
apisix:
  enabled: true

ingress-nginx:
  enabled: false

# Platform Services
admin-server:
  enabled: true

# OTMM (MicroTX) components can be toggled independently. The console only
# deploys when the coordinator and/or workflow server is also enabled.
otmm:
  coordinator:
    enabled: true
  workflowServer:
    enabled: true
  console:
    enabled: true

# Database (SIDB-FREE by default)
# Database uses SIDB-FREE by default from values.yaml

oracle-database-exporter:
  enabled: true

# AI Optimizer (disabled by default)
ai-optimizer:
  enabled: false

# Config Server
config-server:
  enabled: true

# Create a Strimzi-managed Kafka cluster.
kafka:
  enabled: true
  version: 4.2.0
  metadataVersion: 4.2-IV1
  # Enables Strimzi's strimziMetricsReporter, exposing broker JMX metrics
  # (throughput, request latency, cluster health) that SigNoz scrapes
  # automatically via the signoz.io/scrape pod annotation.
  metricsEnabled: true

# Observability
# Scrape Kafka broker/topic/partition/consumer-group facts (broker count,
# topic count, consumer lag, replicas, offsets) into SigNoz via the OTel
# collector's kafkametrics receiver, for the "Kafka Server Monitoring
# Dashboard".
signoz:
  enabled: true
  otelCollector:
    config:
      receivers:
        kafkametrics:
          brokers:
            - "kafka-bootstrap:9092"
          protocol_version: "2.0.0"
          scrapers:
            - brokers
            - topics
            - consumers
          # kafka.brokers and the kafka.consumer_group.* metrics are enabled by default,
          # but the topic/partition metrics used by the "Kafka Server Monitoring Dashboard"
          # are opt-in in this receiver and must be enabled explicitly.
          metrics:
            kafka.topic.partitions:
              enabled: true
            kafka.partition.current_offset:
              enabled: true
            kafka.partition.oldest_offset:
              enabled: true
            kafka.partition.replicas:
              enabled: true
            kafka.partition.replicas_in_sync:
              enabled: true

      service:
        pipelines:
          metrics:
            receivers:
              - otlp
              - prometheus
              - kafkametrics
