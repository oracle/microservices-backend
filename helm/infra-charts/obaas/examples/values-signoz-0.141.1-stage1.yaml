# SigNoz 0.141.1 two-stage upgrade: Stage 1 profile.
#
# Creates retained CSI snapshots, upgrades ClickHouse to 25.12.5, validates the live
# version and snapshot/PVC identities, and writes the completion marker required by
# Stage 2.
#
# Layer this file after the customer's normal values files and use the same Helm
# release name and namespace that own the existing OBaaS installation. Set the Helm
# command timeout higher than signozUpgrade.backup.timeout (30m is recommended for
# the default 20m snapshot timeout).

signozUpgrade:
  stage: stage1
  # Set this if the cluster does not provide one compatible default class:
  # backup:
  #   volumeSnapshotClassName: example-snapshot-class
  # OKE users should prepare the cluster with tools/prepare-oke-volume-snapshots.sh
  # and layer examples/values-signoz-0.141.1-stage1-oke.yaml after this file.
  # Or map heterogeneous PVC StorageClasses to their snapshot classes:
  #   volumeSnapshotClassByStorageClass:
  #     example-storage-class: example-snapshot-class

# Keep SigNoz on the OBaaS 2.1.0 intermediate version during Stage 1 while
# ClickHouse is upgraded to the version required by SigNoz 0.141.1. An OBaaS
# 2.0.0 source installation therefore passes through this intermediate version.
signoz:
  signoz:
    image:
      tag: v0.113.0
  otelCollector:
    image:
      tag: v0.144.1
  telemetryStoreMigrator:
    enabled: false
  clickhouse:
    image:
      tag: 25.12.5
