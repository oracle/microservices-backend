apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "signoz-dashboards.jobName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/name: signoz-dashboards
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-dashboards
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.signoz.orgDiscovery.enabled }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: signoz
                  app.kubernetes.io/instance: {{ .Values.signoz.releaseName }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      initContainers:
        - name: wait-for-signoz
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python3, /scripts/import-dashboards.py, --wait]
          env:
            - name: SIGNOZ_URL
              value: {{ include "signoz-dashboards.url" . | quote }}
          volumeMounts:
            - name: importer
              mountPath: /scripts
              readOnly: true
        {{- if .Values.signoz.orgDiscovery.enabled }}
        - name: signoz-id-discovery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python3, /scripts/import-dashboards.py, --discover-org]
          volumeMounts:
            - name: importer
              mountPath: /scripts
              readOnly: true
            - name: shared-data
              mountPath: /shared
            - name: signoz-db
              mountPath: /signoz-db
              readOnly: true
        {{- end }}
      containers:
        - name: signoz-setup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python3, /scripts/import-dashboards.py]
          env:
            - name: SIGNOZ_URL
              value: {{ include "signoz-dashboards.url" . | quote }}
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          volumeMounts:
            - name: importer
              mountPath: /scripts
              readOnly: true
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
            - name: signoz-authn
              mountPath: /signoz-authn
              readOnly: true
            - name: shared-data
              mountPath: /shared
      volumes:
        - name: importer
          configMap:
            name: {{ include "signoz-dashboards.scriptName" . }}
        - name: dashboards
          projected:
            sources:
              {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
              - configMap:
                  name: {{ include "signoz-dashboards.configMapName" $path }}
                  items:
                    - key: dashboard.json
                      path: {{ base $path | quote }}
              {{- end }}
        - name: signoz-authn
          secret:
            secretName: {{ required "signoz.auth.existingSecret is required" .Values.signoz.auth.existingSecret }}
        - name: shared-data
          emptyDir: {}
        {{- if .Values.signoz.orgDiscovery.enabled }}
        - name: signoz-db
          persistentVolumeClaim:
            claimName: {{ .Values.signoz.orgDiscovery.pvcName | default (printf "signoz-db-%s-signoz-0" .Values.signoz.releaseName) }}
            readOnly: true
        {{- end }}

