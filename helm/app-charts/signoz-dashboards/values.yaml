signoz:
  # Install this chart in the same namespace as this OBaaS release.
  releaseName: obaas
  # Empty derives http://<releaseName>-signoz:8080.
  url: ""
  auth:
    # Existing secret with email and password; optionally orgID.
    existingSecret: signoz-authn
  orgDiscovery:
    # Mirrors OBaaS setup: read the organization ID from SigNoz's SQLite PVC.
    # Disable when the credential secret already contains orgID.
    enabled: true
    # Empty derives signoz-db-<releaseName>-signoz-0.
    pvcName: ""

image:
  # The full Oracle Linux 9 image includes Python 3 and its SQLite module.
  repository: container-registry.oracle.com/os/oraclelinux
  tag: "9"
  pullPolicy: IfNotPresent
imagePullSecrets: []

job:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
