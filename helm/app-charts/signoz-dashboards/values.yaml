signoz:
  # Install this chart in the same namespace as this OBaaS release.
  releaseName: obaas
  # Empty derives http://<releaseName>-signoz:8080.
  url: ""
  auth:
    # Existing secret with email and password. Set orgID to select an organization
    # explicitly; otherwise discover the single organization for this email via API.
    existingSecret: signoz-authn

image:
  # The full Oracle Linux 9 image includes Python 3 and its standard library.
  repository: container-registry.oracle.com/os/oraclelinux
  tag: "9"
  pullPolicy: IfNotPresent
imagePullSecrets: []

job:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
